e:1.25rem;margin-bottom:.6rem}.purchase-copy p{font-size:1rem;color:var(--body)}.purchase-copy .purchase-hint{font-size:.875rem;color:var(--muted);margin-top:1rem}.purchase-qr{margin:0;text-align:center;min-width:0}.purchase-qr img{display:block;width:100%;height:auto;background:white;padding:12px}.purchase-qr figcaption{margin-top:.65rem;color:var(--muted);font-size:.875rem}\r\n    @media(max-width:540px){.purchase-contact{grid-template-columns:1fr;gap:1.3rem}.purchase-qr{width:min(100%,240px);justify-self:center}}\r\n    @media(min-width:1500px){.shell{padding-top:4.5rem}}@media(max-width:1050px){.shell{gap:2rem;grid-template-columns:145px minmax(0,1fr)}.role{padding:1.2rem}.role h3 span{display:block;margin-left:0}.contents a{padding-left:.7rem}}\r\n    @media(max-width:800px){.shell{display:block;max-width:760px;padding-top:2.4rem}.contents{display:none}.intro{padding-bottom:2rem}.roles{margin-top:1.2rem}section{padding:2.1rem 0}.decision{margin-top:2.1rem}}\r\n    @media(max-width:540px){.topbar{padding:.85rem 1.25rem}.brand{font-size:.75rem}.top-label{font-size:.8125rem}.shell{padding:1.9rem 1.25rem 1.1rem}.intro\u003ep{font-size:1.0625rem}h2{font-size:1.25rem}.roles{grid-template-columns:1fr}.role{display:grid;grid-template-columns:2rem 1fr;column-gap:.7rem;padding:1.1rem}.role-icon{grid-row:span 2;margin:.2rem 0 0}.role h3 span{display:inline;margin-left:.4rem}.role p{margin-top:.2rem}.role:not(:last-child)::after{display:none}.timeline{grid-template-columns:1fr;margin-top:1.2rem}.timeline li,.timeline li:last-child{border-top:0;border-left:1px solid #555054;padding:0 0 1.45rem 1.4rem;margin-left:4px}.timeline li:last-child{padding-bottom:0}.timeline li::before{left:-5px;top:.5rem}.boundary-grid{grid-template-columns:1fr;gap:1.5rem}.decision{padding:1.3rem 1.15rem}.workflow{padding:.9rem 1rem}.flow{gap:.2rem .6rem}.footer{align-items:start;font-size:.8125rem}.footer\u003espan{max-width:70%}}\r\n    @media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{transition:none!important}}\r\n    @media print{html{color-scheme:light}body{background:white;color:#222;font-size:11pt;--ink:#222;--body:#444;--muted:#555;--line:#ccc;--accent:#96311e;--panel:#fafafa}.topbar{position:static;background:white}.contents,.footer a,.skip{display:none}.shell{display:block;padding:20px 0;max-width:100%}.intro::before{display:none}h1{font-size:28pt}section{padding:18px 0}.role,.role:last-child,.decision{background:#fafafa}.role:not(:last-child)::after{background:#fafafa}.decision{margin-top:18px}.timeline li::before{box-shadow:none}section,.decision,.role{break-inside:avoid}.footer{padding-top:12px}}\r\n  .header-actions{display:flex;align-items:center;justify-content:flex-end;gap:1rem;flex-wrap:wrap}.back-link{display:inline-flex;align-items:center;min-height:44px;padding:.45rem .9rem;border:1px solid var(--line);color:var(--ink);font-size:.9375rem;white-space:nowrap}.back-link:hover{border-color:var(--accent);color:var(--accent)}@media(max-width:540px){.topbar{flex-wrap:wrap}.header-actions{gap:.65rem}.header-actions .top-label{display:none}}@media print{.back-link{display:none}}\r\n    .tutorial-notice{margin-top:1.8rem;padding:1.5rem 1.75rem;border:1px solid #ff795f88;border-left:4px solid var(--brand);background:linear-gradient(110deg,#ff4d2e18,#ff4d2e06),var(--panel)}.tutorial-notice h3{font-size:1.375rem;line-height:1.5;color:var(--accent);font-weight:700;margin:0 0 .65rem}.tutorial-notice p{font-size:1.0625rem;line-height:1.9;color:var(--ink)}.tutorial-notice strong{color:var(--accent);font-weight:700}@media(max-width:540px){.tutorial-notice{padding:1.2rem;margin-top:1.4rem}.tutorial-notice h3{font-size:1.25rem}}\r\n\u003c/style\u003e\r\n\u003c/head\u003e\r\n\u003cbody id=\"top\"\u003e\r\n  \u003ca class=\"skip\" href=\"#main\"\u003e跳到正文\u003c/a\u003e\r\n  \u003cheader class=\"topbar\"\u003e\u003ca class=\"brand\" href=\"#top\" aria-label=\"Overlay Studio 买前须知页首\"\u003eOVERLAY\u003ci\u003e/\u003c/i\u003eSTUDIO\u003c/a\u003e\u003cdiv class=\"header-actions\"\u003e\u003cspan class=\"top-label\"\u003e买前须知\u003c/span\u003e\u003ca class=\"back-link\" href=\"#compare\" target=\"_parent\"\u003e← 返回版本对比\u003c/a\u003e\u003c/div\u003e\u003c/header\u003e\r\n  \u003cdiv class=\"shell\"\u003e\r\n    \u003caside class=\"contents\" aria-label=\"阅读导航\"\u003e\r\n      \u003cp class=\"contents-label\"\u003eBEFORE YOU BUY\u003c/p\u003e\r\n      \u003cnav aria-label=\"页内目录\"\u003e\r\n        \u003ca href=\"#prepare\"\u003e\u003cspan\u003e01\u003c/span\u003e先准备什么\u003c/a\u003e\r\n        \u003ca href=\"#start\"\u003e\u003cspan\u003e02\u003c/span\u003e上手的过程\u003c/a\u003e\r\n        \u003ca href=\"#support\"\u003e\u003cspan\u003e03\u003c/span\u003e自定义与售后\u003c/a\u003e\r\n        \u003ca href=\"#check\"\u003e\u003cspan\u003e04\u003c/span\u003e如何购买\u003c/a\u003e\r\n      \u003c/nav\u003e\r\n      \u003cp class=\"contents-note\"\u003e先了解使用方式，\u003cbr\u003e\u003cb\u003e再决定是否适合你。\u003c/b\u003e\u003c/p\u003e\r\n    \u003c/aside\u003e\r\n    \u003cmain id=\"main\"\u003e\r\n      \u003cdiv class=\"intro\"\u003e\r\n        \u003cdiv class=\"eyebrow\"\u003eOVERLAY STUDIO / BUYER’S GUIDE\u003c/div\u003e\r\n        \u003ch1\u003e下单之前，\u003cbr\u003e先看这一页。\u003c/h1\u003e\r\n        \u003cp\u003e用几分钟了解你会拿到什么、需要准备什么，\u003cbr class=\"desktop-break\"\u003e以及第一次使用时的合理预期。\u003c/p\u003e\r\n      \u003c/div\u003e\r\n\r\n\u003csection id=\"prepare\" aria-labelledby=\"prepare-title\"\u003e\r\n        \u003cdiv class=\"section-head\"\u003e\u003cspan class=\"number\"\u003e01\u003c/span\u003e\u003ch2 id=\"prepare-title\"\u003e购买前，准备好这三件事。\u003c/h2\u003e\u003c/div\u003e\r\n        \u003cul class=\"requirements\"\u003e\r\n          \u003cli\u003e\u003cspan class=\"req-symbol\" aria-hidden=\"true\"\u003eAI\u003c/span\u003e\u003cdiv\u003e\u003ch3\u003e能操作本地文件、运行命令的 AI 编程助手\u003c/h3\u003e\u003cp\u003e例如 Claude Code、Codex、CodeBuddy。仅使用网页版聊天工具不够。\u003cstrong\u003e建议使用能力范围内最好的大模型——大模型的能力决定了你产出的质量。\u003c/strong\u003e\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\r\n          \u003cli\u003e\u003cspan class=\"req-symbol\" aria-hidden=\"true\"\u003e01\u003c/span\u003e\u003cdiv\u003e\u003ch3\u003e熟悉如何与大模型对话\u003c/h3\u003e\u003cp\u003eOverlay Studio 需要配合你自己的大模型使用。想法、需求和问题反馈，都直接与大模型沟通。\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\r\n          \u003cli\u003e\u003cspan class=\"req-symbol\" aria-hidden=\"true\"\u003eHD\u003c/span\u003e\u003cdiv\u003e\u003ch3\u003eMac 或 Windows 电脑，约 20 GB 空余空间\u003c/h3\u003e\u003cp\u003e逐帧导出会占用较多磁盘空间。\u003c/p\u003e\u003c/div\u003e\u003c/li\u003e\r\n        \u003c/ul\u003e\r\n        \u003cp class=\"aside-note\"\u003e还没有 AI 助手？先装好并试用，再考虑购买。\u003c/p\u003e\r\n      \u003c/section\u003e\r\n\r\n      \u003csection id=\"start\" aria-labelledby=\"start-title\"\u003e\r\n        \u003cdiv class=\"section-head\"\u003e\u003cspan class=\"number\"\u003e02\u003c/span\u003e\u003ch2 id=\"start-title\"\u003e先跑起来，再慢慢长出你的风格。\u003c/h2\u003e\u003c/div\u003e\r\n        \u003col class=\"timeline\" aria-label=\"从安装到日常使用的上手时间线\"\u003e\r\n          \u003cli\u003e\u003cdiv class=\"time-label\"\u003e安装调试，约 30–60 分钟\u003c/div\u003e\u003ch3\u003e让 AI 帮你装好\u003c/h3\u003e\u003cp\u003e每个人的电脑环境不同，可能遇到不同报错。把完整报错交给 AI；根据客户反馈，97% 的客户表示，大模型能够自行修复。\u003c/p\u003e\u003c/li\u003e\r\n          \u003cli\u003e\u003cdiv class=\"time-label\"\u003e前 1–3 期 · 磨合\u003c/div\u003e\u003ch3\u003e告诉它你的口味\u003c/h3\u003e\u003cp\u003e「这里太密」「颜色不对」——逐次反馈，让 AI 记录你的偏好。\u003c/p\u003e\u003c/li\u003e\r\n          \u003cli\u003e\u003cdiv class=\"time-label\"\u003e磨合之后 · 逐步积累\u003c/div\u003e\u003ch3\u003e越来越像你的作品\u003c/h3\u003e\u003cp\u003e持续积累卡片与偏好，让后续编排更贴近你的风格。\u003c/p\u003e\u003c/li\u003e\r\n        \u003c/ol\u003e\r\n        \u003cdiv class=\"workflow\"\u003e\u003cdiv class=\"workflow-label\"\u003e熟悉后的日常流程\u003c/div\u003e\u003cdiv class=\"flow\" aria-label=\"导入字幕，AI 编排，你来微调，导出\"\u003e\u003cspan\u003e导入字幕\u003c/span\u003e\u003ci aria-hidden=\"true\"\u003e→\u003c/i\u003e\u003cspan\u003eAI 编排\u003c/span\u003e\u003ci aria-hidden=\"true\"\u003e→\u003c/i\u003e\u003cspan\u003e你来微调\u003c/span\u003e\u003ci aria-hidden=\"true\"\u003e→\u003c/i\u003e\u003cspan\u003e导出\u003c/span\u003e\u003c/div\u003e\u003c/div\u003e\r\n        \u003cp class=\"preset\"\u003e演示视频使用的是反复打磨过的参数，交付的是\u003cstrong\u003e中性默认值\u003c/strong\u003e。专业版也提供「枝鸥预设」，可让 AI 切换，再按你的喜好调整。另外，\u003cstrong\u003e大模型的能力决定了你产出的质量\u003c/strong\u003e，建议使用能力范围内最好的那个。\u003c/p\u003e\r\n        \r\n      \u003c/section\u003e\r\n\r\n      \u003csection id=\"support\" aria-labelledby=\"support-title\"\u003e\r\n        \u003cdiv class=\"section-head\"\u003e\u003cspan class=\"number\"\u003e03\u003c/span\u003e\u003ch2 id=\"support-title\"\u003e可以自由改，也要知道维护与售后方式。\u003c/h2\u003e\u003c/div\u003e\r\n        \u003cdiv class=\"boundary-grid\"\u003e\r\n          \u003cdiv\u003e\u003ch3\u003e源码开放，改动由你维护\u003c/h3\u003e\u003cp\u003e加卡片、改动效、换配色，都可以让 AI 做。\u003cstrong\u003e但售后只覆盖原版源码\u003c/strong\u003e：没改过就出现的问题，我来修；你或 AI 改过、加过东西之后才出现的，需要你自己解决——换回一份没改过的源码再跑一次，就能分辨是哪一种。另外，更新时有几个文件会被替换，仓库里的《更新指南》写了怎么保住自己的改动。\u003c/p\u003e\u003c/div\u003e\r\n          \u003cdiv\u003e\u003ch3\u003e遇到问题，先找你的 AI\u003c/h3\u003e\u003cdiv class=\"support-path\"\u003e\u003cb\u003e完整报错交给 AI\u003c/b\u003e\u003cspan aria-hidden=\"true\"\u003e→\u003c/span\u003e\u003cb\u003e解决不了再联系作者\u003c/b\u003e\u003c/div\u003e\u003cp\u003e安装、使用和自定义的问题，先请 AI 排查；作者看到后会回复，不提供随时在线的客服式支持。\u003c/p\u003e\u003c/div\u003e\r\n        \u003c/div\u003e\r\n      \u003caside class=\"tutorial-notice\" aria-label=\"视频教程上线说明\"\u003e\u003ch3\u003e视频教程即将上线\u003c/h3\u003e\u003cp\u003e详细使用视频教程正在制作中，预计近期上线。上线后将统一发送给\u003cstrong\u003e已付费用户\u003c/strong\u003e。\u003c/p\u003e\u003c/aside\u003e\r\n      \u003c/section\u003e\r\n\r\n      \u003csection class=\"decision\" id=\"check\" aria-labelledby=\"check-title\"\u003e\r\n        \u003cdiv class=\"section-head\"\u003e\u003cspan class=\"number\"\u003e04\u003c/span\u003e\u003ch2 id=\"check-title\"\u003e如何购买\u003c/h2\u003e\u003c/div\u003e\r\n        \u003cdiv class=\"purchase-contact\"\u003e\r\n          \u00
